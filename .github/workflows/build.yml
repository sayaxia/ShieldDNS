name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 MinGW（提供 windres）
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: 启用 Cargo 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: 构建（build.ps1）
        shell: pwsh
        env:
          SHIELDDNS_MINGW: C:\msys64\mingw64\bin
        run: |
          .\build.ps1

      - name: 打包
        shell: pwsh
        run: |
          $ver = (Select-String -Path core\Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $name = "ShieldDNS-$ver-win-x64"
          New-Item -ItemType Directory -Path "out\$name" -Force | Out-Null
          Copy-Item dist\ShieldDNS.exe "out\$name\" -Force
          Copy-Item dist\core "out\$name\core" -Recurse -Force
          Copy-Item README.md, LICENSE "out\$name\" -Force
          Copy-Item scripts\update.cmd "out\$name\" -Force
          Compress-Archive -Path "out\$name" -DestinationPath "out\$name.zip" -CompressionLevel Optimal
          echo "ASSET=out\$name.zip" >> $env:GITHUB_ENV
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      # ---- 代码签名（SignPath，配置好 Organization ID / 项目 / 策略后自动启用）----
      # 需要仓库 Variables: SIGNPATH_ORG_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
      # 需要仓库 Secrets: SIGNPATH_API_TOKEN
      # 详见 docs/SIGNING.md
      - name: 上传待签名产物
        id: upload
        if: vars.SIGNPATH_ORG_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: out/*.zip

      - name: SignPath 签名
        if: vars.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # 签名产物默认落在 signed\，必须回填到 out\ 才能被下面的上传/发布用上，
      # 否则 Release 里发的仍然是未签名包。
      - name: 用签名包替换未签名包
        if: vars.SIGNPATH_ORG_ID != ''
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Path signed -Filter *.zip -Recurse -File
          if (-not $zips) { throw '签名产物目录 signed\ 里没有 zip，签名流程可能失败' }
          foreach ($z in $zips) {
            Copy-Item -LiteralPath $z.FullName -Destination (Join-Path 'out' $z.Name) -Force
            Write-Host "已回填签名包: $($z.Name) ($($z.Length) 字节)"
          }

      - name: 校验签名有效性
        if: vars.SIGNPATH_ORG_ID != ''
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path out -Filter *.zip -File | Select-Object -First 1
          $tmp = Join-Path $env:RUNNER_TEMP 'sigcheck'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $tmp -Force
          $targets = Get-ChildItem -Path $tmp -Filter *.exe -Recurse -File
          if (-not $targets) { throw '签名包里没有找到 exe' }
          foreach ($exe in $targets) {
            $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
            if ($sig.Status -ne 'Valid') { throw "签名无效: $($exe.Name) -> $($sig.Status) $($sig.StatusMessage)" }
            Write-Host "签名有效: $($exe.Name) <- $($sig.SignerCertificate.Subject)"
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShieldDNS-${{ env.VERSION }}-win-x64
          path: out/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
